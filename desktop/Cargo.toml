[package]
name = "muffle"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Kaleidal <hello@kaleid.al>"]
description = "A fast, expressive Spotify desktop client"
license = "MIT"
publish = false

[[bin]]
name = "muffle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aes = "0.8.4"
base64 = "0.22.1"
ctr = "0.9.2"
directories = "6.0.0"
librespot-connect = { version = "0.8.0", default-features = false }
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false }
mdns-sd = "0.21.0"
open = "5.4.1"
parking_lot = "0.12.5"
pbkdf2 = "0.12.2"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "gzip", "form", "query", "blocking"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.1.20" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sha2 = "0.10.9"
hmac = "0.12.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
librespot-playback = { version = "0.8.0", default-features = false, features = ["pulseaudio-backend", "rustls-tls-native-roots"] }
mpris-server = "0.10.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
